<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" width="860" height="340">
  <rect width="860" height="340" fill="#ffffff"/>
  <text x="30" y="42" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="18" font-weight="600" fill="#1f2328">亮度控制链路：断点在哪一层</text>
  <text x="30" y="66" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#59636e">设备管理器、驱动版本、WMI 亮度接口全部正常，问题出在用户态服务被禁用</text>

  <!-- box 1 -->
  <rect x="30" y="96" width="170" height="76" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <text x="115" y="126" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#1f2328">亮度滑块 / 亮度键</text>
  <text x="115" y="150" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#59636e">用户操作 · 正常</text>

  <path d="M200 134 L226 134" stroke="#1a7f37" stroke-width="2" fill="none" marker-end="url(#g)"/>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1a7f37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#cf222e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- box 2 -->
  <rect x="230" y="96" width="170" height="76" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <text x="315" y="126" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#1f2328">Windows 亮度接口</text>
  <text x="315" y="150" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#1a7f37">WMI · Level 0-100 正常</text>

  <path d="M400 134 L426 134" stroke="#cf222e" stroke-width="2" fill="none" marker-end="url(#r)"/>

  <!-- box 3 -->
  <rect x="430" y="96" width="170" height="76" rx="8" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
  <text x="515" y="124" text-anchor="middle" font-family="Consolas,monospace" font-size="11" fill="#1f2328">NvContainerLocalSystem</text>
  <text x="515" y="150" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#cf222e">Disabled · 断点</text>

  <path d="M600 134 L626 134" stroke="#cf222e" stroke-width="2" fill="none" marker-end="url(#r)" stroke-dasharray="5 4"/>

  <!-- box 4 -->
  <rect x="630" y="96" width="170" height="76" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <text x="715" y="126" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#1f2328">内屏背光</text>
  <text x="715" y="150" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#cf222e">收不到指令 · 不变</text>

  <!-- why normal checks fail -->
  <rect x="30" y="200" width="800" height="52" rx="6" fill="#fff8c5" stroke="#d4a72c" stroke-width="1"/>
  <text x="46" y="222" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#7d4e00">为什么常规排查全部失效</text>
  <text x="46" y="242" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#7d4e00">驱动照常加载、设备状态 OK、版本号正常、WMI 写入被接受 —— 四层表象全部健康，唯独用户态容器断了</text>

  <!-- fix result -->
  <rect x="30" y="268" width="800" height="48" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/>
  <text x="46" y="298" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#116329">修复：Set-Service -StartupType Automatic → Start-Service → pnputil /restart-device 　（立即生效，无需重启）</text>
</svg>

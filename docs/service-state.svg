<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300">
  <rect width="860" height="300" fill="#ffffff"/>
  <text x="30" y="40" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="18" font-weight="600" fill="#1f2328">一条命令定位：服务状态对比</text>
  <text x="30" y="64" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#59636e">Get-Service NvContainerLocalSystem | Select-Object Status, StartType</text>

  <!-- before -->
  <rect x="30" y="86" width="360" height="170" rx="8" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
  <text x="48" y="114" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#cf222e">修复前（故障状态）</text>
  <rect x="48" y="128" width="324" height="106" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="62" y="152" font-family="Consolas,monospace" font-size="12" fill="#59636e">Status    StartType</text>
  <text x="62" y="170" font-family="Consolas,monospace" font-size="12" fill="#59636e">------    ---------</text>
  <text x="62" y="192" font-family="Consolas,monospace" font-size="13" font-weight="600" fill="#cf222e">Stopped   Disabled</text>
  <text x="62" y="216" font-family="'Microsoft YaHei',sans-serif" font-size="11" fill="#cf222e">重启也不会自动启动 → 问题永久存在</text>

  <!-- arrow -->
  <path d="M398 171 L436 171" stroke="#1a7f37" stroke-width="2" fill="none" marker-end="url(#ag)"/>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1a7f37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- after -->
  <rect x="444" y="86" width="386" height="170" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="462" y="114" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#1a7f37">修复后（正常状态）</text>
  <rect x="462" y="128" width="350" height="106" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="476" y="152" font-family="Consolas,monospace" font-size="12" fill="#59636e">Status    StartType</text>
  <text x="476" y="170" font-family="Consolas,monospace" font-size="12" fill="#59636e">------    ---------</text>
  <text x="476" y="192" font-family="Consolas,monospace" font-size="13" font-weight="600" fill="#1a7f37">Running   Auto</text>
  <text x="476" y="216" font-family="'Microsoft YaHei',sans-serif" font-size="11" fill="#1a7f37">亮度滑块与亮度键立即恢复，无需重启</text>

  <text x="30" y="282" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#59636e">如果这一项是 Disabled，本文的修复方案直接适用。如果已是 Running 却仍然不能调亮度，属于另一类问题，见 README 的诊断速查表。</text>
</svg>
